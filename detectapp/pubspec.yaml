name: car_face_recognition
description: Car-mounted face recognition system

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  
  # Camera & Image
  camera: ^0.10.5+5
  image: ^4.1.3
  
  # TFLite - Version that works with Flutter 3.x
  tflite_flutter:  ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/facenet.tflite