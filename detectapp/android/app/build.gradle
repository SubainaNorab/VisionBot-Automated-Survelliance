plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Google Maps SDK — value must be NON-EMPTY or the app crashes when GoogleMap loads
// (IllegalStateException: API key not found). Prefer a real key from:
//   android/local.properties → maps.api.key=...
//   env MAPS_API_KEY or GOOGLE_MAPS_ANDROID_KEY (CI)
def mapsApiKey = (localProperties.getProperty('maps.api.key') ?: '').trim()
if (mapsApiKey.isEmpty()) {
    mapsApiKey = (System.getenv('MAPS_API_KEY') ?: '').trim()
}
if (mapsApiKey.isEmpty()) {
    mapsApiKey = (System.getenv('GOOGLE_MAPS_ANDROID_KEY') ?: '').trim()
}
def keysFile = rootProject.file('keys.properties')
if (mapsApiKey.isEmpty() && keysFile.exists()) {
    def p = new Properties()
    keysFile.withReader('UTF-8') { p.load(it) }
    mapsApiKey = (p.getProperty('maps.api.key') ?: '').trim()
}
if (mapsApiKey.isEmpty()) {
    mapsApiKey = 'DUMMY_KEY_SET_maps.api.key_IN_local_properties'
    logger.lifecycle('')
    logger.lifecycle('WARNING: Google Maps API key missing.')
    logger.lifecycle('Add to android/local.properties: maps.api.key=<your Android Maps SDK key>')
    logger.lifecycle('Using a placeholder so the app does not crash; tiles will not load until set.')
    logger.lifecycle('')
}

android {
    namespace "com.example.detectapp"
    compileSdk = 36  // ✅ UPDATED to 36
    ndkVersion "26.3.11579264"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.detectapp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34  // Keep as 34 for now
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    
    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
}

// Apply Google Services plugin at the end
apply plugin: 'com.google.gms.google-services'

// Maps key: android/local.properties → maps.api.key=...
//   or env MAPS_API_KEY / GOOGLE_MAPS_ANDROID_KEY
//   or android/keys.properties (see keys.properties.example; file is gitignored)
